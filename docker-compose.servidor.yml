services:
  db:
    image: postgres:15
    container_name: telecom_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER debe estar definido en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe estar definido en .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB debe estar definido en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: telecom-backend:${IMAGE_TAG:-latest}
    container_name: telecom_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe estar definido en .env}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?PUBLIC_URL debe estar definido en .env}
      FRONTEND_URL: ${PUBLIC_URL:?PUBLIC_URL debe estar definido en .env}
      USAR_LIMITADOR_LOCAL: "true"
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY debe estar definido en .env}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution_api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      WHATSAPP_SEND_DELAY_MS: ${WHATSAPP_SEND_DELAY_MS:-10000}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-}
      WEEKLY_REPORT_RECIPIENT_EMAIL: ${WEEKLY_REPORT_RECIPIENT_EMAIL:-}
      WEEKLY_REPORT_RECIPIENT_NAME: ${WEEKLY_REPORT_RECIPIENT_NAME:-}
      EJECUTAR_CRON: ${EJECUTAR_CRON:-false}
    command: ["sh", "-c", "npx prisma db push --accept-data-loss && npm start"]
    expose:
      - "4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/salud').then((respuesta) => process.exit(respuesta.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: telecom-frontend:${IMAGE_TAG:-latest}
    container_name: telecom_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

  evolution_api:
    profiles: ["whatsapp"]
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    depends_on:
      evolution_redis:
        condition: service_healthy
    environment:
      SERVER_URL: http://localhost:${EVOLUTION_PORT:-5000}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-clave-local-evolution-no-usar}
      DATABASE_ENABLED: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution_redis:6379/6
      CACHE_REDIS_TTL: "604800"
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances

  evolution_redis:
    profiles: ["whatsapp"]
    image: redis:7.4-alpine
    container_name: evolution_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  evolution_instances:
  evolution_redis_data: