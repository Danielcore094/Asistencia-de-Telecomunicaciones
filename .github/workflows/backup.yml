name: Respaldo de base de datos

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci --prefix backend

      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl gnupg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/postgresql.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verificar cliente PostgreSQL
        run: pg_dump --version

      - name: Crear respaldo cifrado
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
          BACKUP_OUTPUT_DIR: backups
        run: |
          test -n "$DATABASE_URL"
          test -n "$BACKUP_ENCRYPTION_PASSWORD"
          npm run backup --prefix backend
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_ENCRYPTION_PASSWORD" backups/*.dump
          rm backups/*.dump

      - name: Conservar respaldo cifrado durante 30 días
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-postgresql-${{ github.run_id }}
          path: backups/*.dump.gpg
          if-no-files-found: error
          retention-days: 30