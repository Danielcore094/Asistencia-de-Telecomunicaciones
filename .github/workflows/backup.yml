name: Respaldo de base de datos

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci --prefix backend

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Crear respaldo cifrado
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$BACKUP_ENCRYPTION_PASSWORD"
          node backend/scripts/backupDatabase.mjs
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_ENCRYPTION_PASSWORD" backups/*.dump
          rm backups/*.dump

      - name: Conservar respaldo cifrado durante 30 días
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-postgresql-${{ github.run_id }}
          path: backups/*.dump.gpg
          if-no-files-found: error
          retention-days: 30