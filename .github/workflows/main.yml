name: Calidad

on:
  push:
    branches: [ main ] # Se activa al subir cambios a la rama principal
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix backend

      - name: Ejecutar pruebas unitarias
        working-directory: backend
        run: node --test tests/*.test.js

      - name: Verificar compilación del backend
        env:
          DATABASE_URL: postgresql://usuario:contrasena@localhost:5432/asistencia
          DIRECT_URL: postgresql://usuario:contrasena@localhost:5432/asistencia
          JWT_SECRET: secreto-solo-para-compilacion-ci
        run: npm run build --prefix backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix frontend

      - name: Verificar compilación del frontend
        run: npm run build --prefix frontend